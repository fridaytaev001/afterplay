# Apply in your own namespace; the existing vLLM deployment stays unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: afterplay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent
      component: afterplay
  template:
    metadata:
      labels:
        app: agent
        component: afterplay
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: afterplay
          image: python:3.12-slim
          command: ["python", "/app/app.py"]
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: VLLM_BASE_URL
              value: "http://vllm:8000/v1"
            - name: VLLM_API_KEY
              value: "not-needed"
            - name: DATA_PATH
              value: "/data/game.sqlite"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "2"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: history
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code
          configMap:
            name: afterplay-code
        - name: history
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: afterplay
spec:
  selector:
    app: agent
    component: afterplay
  ports:
    - port: 8080
      targetPort: 8080
